name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  clients:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - adam
          - apple2
          - atari
          - coco
          - msdos

          # Builds clean as of this writing, held back pending review.
          #- c64

          # z88dk cannot parse the library header:
          #   fujinet-fuji.h:309: Cannot parse function argument 'NewDisk'
          #- adam_cpm

          # No platform implementation: src/msxrom and include/msxrom
          # do not exist. Only mekkogx/platforms/msxrom.mk is present.
          #- msxrom

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: clients
        run: make ${{ matrix.platform }}/r2r

      - name: Upload artifact for ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: clients/r2r/${{ matrix.platform }}/**

